# Flutter's generated default here is -Xmx8G with 4G metaspace, which asks for
# 12 GB before the emulator, the IDE and a browser have taken their share. On a
# 16 GB machine that crashes the Gradle daemon outright with "insufficient
# memory for the Java Runtime Environment". 3 GB builds this project fine.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation is disabled because this project lives on D:
# while the pub cache lives on C:. The incremental compiler relativises plugin
# source paths against the module directory, and on Windows that throws
# "this and base files have different roots" for every Kotlin plugin - Firebase,
# shared_preferences, url_launcher, package_info_plus and the rest.
#
# The cost is a slower clean build; correctness is unaffected. Remove this line
# only if the project and the pub cache ever end up on the same drive.
kotlin.incremental=false
